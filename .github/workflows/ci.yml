name: CI

# develop and fixes too, not just main: every plan/ and fix/ merge gets a Linux run the day
# it lands, rather than first at the release PR (v1.4.0's red e2e had been on develop for
# three days). build and e2e are required checks on main (scripts/github-repo-security.sh),
# so a release PR can't merge until they pass.
on:
  push:
    branches: [main, develop, fixes]
  pull_request:
    branches: [main, develop, fixes]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  e2e:
    # Confirmed working on real ubuntu-latest CI 2026-09-14 (flightdeck-backend's
    # docs/plans/test-coverage.md Phase 5) — a manual workflow_dispatch run against
    # develop's real codebase passed cleanly, closing the open question this
    # continue-on-error guard existed for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run test:e2e
      # What Playwright saw when a test failed (the page's accessibility snapshot, the error), so
      # a CI-only failure can be diagnosed without re-running it. Test data only, never a user's.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

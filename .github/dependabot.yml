# Dependency update PRs. Weekly rather than daily: this is a solo project, and a daily
# drip of PRs gets ignored, which is worse than a weekly batch that gets read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # PRs land on develop, where each minor version's dependency batch is merged
    # (winglog-backend's CLAUDE.md, "WingLog's dependency updates").
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor bumps; majors stay separate so they get read
      # properly. Electron and better-sqlite3 majors in particular need a native-module
      # rebuild and a real smoke test (see CLAUDE.md), not a rubber stamp.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Vite 8 needs electron-vite >=6, which is still beta (5.0.0's peer range caps at
      # ^7.0.0 — confirmed via `npm view electron-vite peerDependencies`, 2026-09-03).
      # @vitejs/plugin-react 6.x requires vite ^8.0.0, so it's blocked for the same reason.
      # Remove both ignores once electron-vite ships a stable vite-8-compatible release.
      - dependency-name: 'vite'
        versions: ['>=8.0.0']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6.0.0']
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'

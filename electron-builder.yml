appId: com.callumjones.winglog
productName: WingLog
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # migrateDb() reads these at startup (src/main/index.ts) — without this, the packaged
  # app has no migrations to run and fails silently before ever showing a window.
  - drizzle/**/*
asarUnpack:
  - '**/*.node'
  # node-simconnect is LGPL-3.0-or-later. Keeping it outside the asar archive leaves it as
  # ordinary files under resources/app.asar.unpacked/, so a user can replace the library
  # with their own build and run the result — the replaceability the LGPL requires. It's
  # already dynamically required rather than bundled (externalizeDepsPlugin in
  # electron.vite.config.ts). See THIRD-PARTY-LICENSES.md.
  - node_modules/node-simconnect/**/*

# Licence notices have to be readable in an installed copy, not sealed inside the asar.
extraResources:
  - LICENSE
  - COPYRIGHT
  - THIRD-PARTY-LICENSES.md

# Windows is the primary target — MSFS (and therefore this app's real usage) is
# Windows-only. macOS is built for development convenience; there is no plan to
# support Linux.
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  # Unsigned is fine for personal use (see PLAN.md M7) — without this,
  # electron-builder auto-discovers any local dev signing identity and signs
  # with it, which isn't notarized anyway and just adds failure modes.
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

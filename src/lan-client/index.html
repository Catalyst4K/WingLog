<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover: a Home Screen app then keeps the page below the status area, so iOS has no content under it to draw its blurred glass over. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WingLog</title>
    <!-- Saved to the Home Screen it opens full screen, with WingLog's icon and name. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1626" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WingLog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

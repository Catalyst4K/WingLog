<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      M4: MapLibre needs cross-origin OpenFreeMap tile/style fetches (connect-src),
      inline CSS injected by its own stylesheet (style-src), and Web Workers spawned from
      blob: URLs for tile parsing (worker-src) — see docs/decisions.md's 2026-09-01 M4
      tile-source entry for why OpenFreeMap specifically.
    -->
    <!--
      v2 design (winglog-backend docs/plans/v2-design.md, D2): Fira Sans and Fira Mono are vendored in
      src/renderer/src/fonts, so no font is loaded from the network and the CSP names no font host.
    -->
    <!--
      Airline search (docs/decisions.md, 2026-09-01): Fleet fetches a small airline logo
      by IATA code from images.kiwi.com, a free keyless image CDN — img-src needs it
      alongside the existing OpenFreeMap/data: allowances.
    -->
    <!--
      Fleet livery photos (docs/plans/fleet-redesign.md #3, docs/decisions.md
      2026-09-07): the thumbnail adsbdb's registration lookup returns is hosted directly
      on airport-data.com (not a subdomain) — img-src needs it alongside the existing
      allowances.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://tiles.openfreemap.org https://images.kiwi.com https://airport-data.com https://image.airport-data.com https://t.plnspttrs.net; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WingLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
